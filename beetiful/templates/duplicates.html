<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beetiful — Duplicates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body data-bs-theme="dark">
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="btn btn-outline-light btn-sm" href="/">&larr; Library</a>
        <span class="navbar-brand mb-0 h1 mx-3">Duplicate Finder</span>
        <div class="ms-auto d-flex align-items-center gap-3">
            <label class="text-light small mb-0"><input type="checkbox" id="tierProbable" checked> Probable</label>
            <label class="text-light small mb-0"><input type="checkbox" id="tierPossible" checked> Possible</label>
            <button class="btn btn-primary btn-sm" id="scanBtn" onclick="scan()">Scan</button>
        </div>
    </nav>

    <div class="container-fluid p-3">
        <div id="summary" class="mb-3 text-muted">Click <strong>Scan</strong> to search for duplicates.</div>
        <div id="results"></div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/duplicates.js"></script>
</body>
</html>
